[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact/book-call"
  to = "/.netlify/functions/book-call"
  status = 200

[[redirects]]
  from = "/api/contact/submit"
  to = "/.netlify/functions/submit-brief"
  status = 200

[[redirects]]
  from = "/api/careers/apply"
  to = "/.netlify/functions/apply-career"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
